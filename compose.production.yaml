name: classified-laura-production

services:
  laura:
    image: classified-laura:latest
    pull_policy: never
    build:
      context: .
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /etc/nginx/conf.d/active.conf ]; then
          echo 'Nginx: active.conf is missing. Run: bash scripts/init-https.sh' >&2
          exit 1
        fi
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    depends_on:
      laura:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/nginx/conf.d/active.conf && test -s /var/run/nginx.pid && kill -0 $$(cat /var/run/nginx.pid)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot

volumes:
  letsencrypt:
  acme-webroot:
